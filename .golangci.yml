# golangci-lint configuration for yaagents/gateway
# WI-1yaa.REL-6 (CI matrix) + WI-1yaa.NFR-GW-1 (sec hardening)
# Run: golangci-lint run ./...  (from gateway/)
#
# Strategy: explicit disable-all + curated enable list to bypass golangci-lint
# default-linter inclusions (otherwise staticcheck/etc fire even if absent from
# enable:). Minimal v2-compatible schema (no version field, no linters-settings,
# no nested linters.settings — strict schema rejected those in earlier rounds).

linters:
  default: none      # disable all default linters; only what's in `enable:` runs
  enable:
    - errcheck       # unchecked errors (correctness)
    - govet          # suspicious constructs (correctness)
    - ineffassign    # ineffectual assignments (correctness)
    - unused         # unused code (cleanliness)
    - gosec          # security issues G* (safety-critical)
    - misspell       # common spelling mistakes (docs hygiene)
  # Intentionally NOT enabled (test-code noise; v2 schema doesn't accept
  # issues.exclude-rules path-filter to scope these to non-test files):
  #   staticcheck — flags SA1012 nil-Context on a cors test helper that
  #                  uses nil context intentionally
  #   bodyclose   — limiter_test holds SSE conns open across multiple assertions
  #   noctx       — limiter_test + sse_test + jwks use http.Get without ctx in
  #                  test paths where ctx wiring isn't relevant
  # Re-enable selectively once the binary's v2 schema supports path-based
  # issues.exclude-rules in the form needed.
