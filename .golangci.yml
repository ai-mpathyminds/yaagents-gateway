# golangci-lint configuration for yaagents/gateway
# WI-1yaa.REL-6 (CI matrix) + WI-1yaa.NFR-GW-1 (sec hardening)
# Run: golangci-lint run ./...  (from gateway/)
#
# Minimal-schema config — survives strict schema validation across golangci-lint
# v1.x AND v2.x without binary-pin tracking. The yaagents CI uses
# `install-mode: goinstall` to build from source against the runner's Go 1.25
# (necessary because gateway/go.mod targets go 1.25.0; prebuilt v1.64 was Go
# 1.24-built and rejected the target). The goinstall path resolves to whatever
# `@latest` points at and at the time of this config, both `linters-settings:`
# (v1) and `linters: settings:` (the documented v2 nesting) failed the
# binary's strict schema validation. Stripped both to keep the lint running
# while the upstream v2 schema settles.
#
# Trade-off: lost the gosec G101 exclusion (false-positive on GATEWAY_JWT_SECRET
# env-var name string) and the errcheck check-blank: false (allowed
# fmt.Fprint ignored returns). If either triggers a lint hit in gateway code,
# the right fix is either (a) inline `//nolint:gosec // G101: env-var name, not
# a literal credential` annotations, or (b) re-introduce the settings block in
# whatever syntax the pinned golangci-lint version actually accepts.

linters:
  enable:
    - errcheck       # unchecked errors
    - govet          # suspicious constructs
    - staticcheck    # static analysis (SA*, S1*, QF* — includes former gosimple)
    - ineffassign    # ineffectual assignments
    - unused         # unused code
    - gosec          # security issues (G*)
    - bodyclose      # HTTP response body not closed
    - noctx          # HTTP requests without context
    - misspell       # common spelling mistakes
