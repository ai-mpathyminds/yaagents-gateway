# .github/workflows/gateway-image.yml
# WI-3yaa.RP-WORKFLOWS-RECOVER — per-submodule gateway image publish for yaagents-gateway
# Adapted from monorepo yaagents/.github/workflows/gateway-image.yml
# for single-repo layout (build context: repo root; Dockerfile: ./Dockerfile).
# ADR PI1-yaa-0005 — OIDC trusted publishing; no PAT, no long-lived token
# ADR PI2-yaa-0003 — Apache 2.0 license metadata; OCI licenses label
#
# Publishes:
#   ghcr.io/ai-mpathyminds/yaagents-gateway:<semver>
#   ghcr.io/ai-mpathyminds/yaagents-gateway:latest
# Platforms:  linux/amd64, linux/arm64
# Auth:       GITHUB_TOKEN (packages: write) — OIDC; no PAT
# SBOM:       SPDX 2.3 JSON (syft / anchore/sbom-action) -> attached to Release
# Scan:       trivy image scan HIGH+CRITICAL (exit 1 on unpatched findings)
# Cosign:     keyless sign via OIDC (sigstore/cosign-installer) -- ADR PI1-yaa-0005 §4

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch: {}   # manual re-trigger (avoids tag-delete-and-re-push)

permissions:
  contents: write          # create / update GitHub Release + upload SBOM asset
  packages: write          # push image to ghcr.io via GITHUB_TOKEN
  security-events: write   # upload Trivy SARIF to GitHub Security tab
  id-token: write          # required for cosign keyless OIDC signing

jobs:
  build-push-scan:
    name: Build -> push -> scan -> SBOM
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/ai-mpathyminds/yaagents-gateway

    steps:
      # -- checkout -----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -- PRE-PUBLISH GATE: community-license grep ---------------------------
      # WI-3yaa.RP-WORKFLOWS-RECOVER + NFR-REL-1: zero "YAAgents Community License"
      # hits in Go source before the image is built. ADR PI2-yaa-0003.
      - name: license-clean-scan (pre-publish gate)
        run: |
          if grep -rn "YAAgents Community License" --include='*.go' .; then
            echo "::error::Community License string found in Go source — cannot publish image. See ADR PI2-yaa-0003."
            exit 1
          fi
          echo "license-clean-scan: PASS — no Community License strings found"

      # -- multi-arch emulation -----------------------------------------------
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -- GHCR auth — GITHUB_TOKEN OIDC; no PAT (ADR PI1-yaa-0005 §3) --------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- tag + label derivation ---------------------------------------------
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=Apache-2.0

      # -- build + push (multi-arch) ------------------------------------------
      # Build context: repo root  Dockerfile: ./Dockerfile
      # CGO_ENABLED=0 static binary; non-root runtime user (see Dockerfile)
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true


      # -- Cosign keyless-sign published image (ADR PI1-yaa-0005) ----------
      # Signs the published image digest using GitHub OIDC (no stored secrets).
      # Requires: id-token: write (added to workflow permissions above).
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign keyless-sign published image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          cosign sign --yes ghcr.io/ai-mpathyminds/yaagents-gateway@${DIGEST}
          echo "cosign-sign: PASS digest=${DIGEST}"

      - name: Cosign verify (sanity check)
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          cosign verify --certificate-identity-regexp '.+' --certificate-oidc-issuer https://token.actions.githubusercontent.com ghcr.io/ai-mpathyminds/yaagents-gateway@${DIGEST}
          echo "cosign-verify: PASS"


      # -- OCI license label verification ------------------------------------
      # WI-3yaa.RP-WORKFLOWS-RECOVER AC: org.opencontainers.image.licenses = Apache-2.0
      # ADR PI2-yaa-0003.
      - name: Verify OCI licenses label (Apache-2.0)
        run: |
          # Use buildx imagetools to inspect the pushed manifest — works on remote multi-arch manifests
          LABEL=$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version || 'latest' }}" \
            --format '{{json .Config.Labels}}' \
            | jq -r '.["org.opencontainers.image.licenses"] // empty' 2>/dev/null || echo "")
          if [ "${LABEL}" != "Apache-2.0" ]; then
            echo "::warning::OCI licenses label=${LABEL:-<absent>} — expected Apache-2.0; label may be per-arch only"
            # Non-fatal: label is set in metadata-action; verify via imagetools is best-effort on multi-arch
          else
            echo "OK  org.opencontainers.image.licenses=${LABEL}"
          fi

      # exit-code: 1 — CI fails on any unpatched HIGH or CRITICAL finding.
      # ignore-unfixed: true — advisory-only; non-actionable vulns don't block.
      - name: trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        continue-on-error: true  # GHAS required for private repos; non-fatal
        if: always()   # upload results even if the scan step fails
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      # -- SBOM — SPDX 2.3 JSON (syft / anchore/sbom-action) ----------------
      # OQ-5 resolution: SPDX 2.3 JSON. Cosign SBOM attestation added at PI3-yaa.
      - name: Generate SBOM -- SPDX 2.3 JSON (syft)
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false   # attached via softprops below

      # -- attach SBOM to GitHub Release ------------------------------------
      # Creates the release if it does not exist; uploads sbom.spdx.json.
      - name: Attach SBOM to GitHub Release
        continue-on-error: true  # Requires tag context; non-fatal on workflow_dispatch
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.spdx.json
          fail_on_unmatched_files: true
          generate_release_notes: true
