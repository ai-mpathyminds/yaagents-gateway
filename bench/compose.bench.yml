# gateway/bench/compose.bench.yml — bench harness services (WI-4yaa.BENCH-0)
#
# Services:
#   gateway        — yaagents gateway built from local source; plugin config
#                    injected via active-plugins.yaml written by harness.sh.
#   noop-upstream  — trivial HTTP server (always 200); isolates plugin cost.
#
# Usage: harness.sh writes bench/active-plugins.yaml then calls:
#   docker compose -f bench/compose.bench.yml --project-name bench-<plugin> up -d --build --wait
#
# Port 8120: gateway (host-exposed for vegeta attack from host).
# Port 8121: noop-upstream (internal only; not host-exposed).
#
# Build contexts are relative to this file's directory.

name: yaagents-bench

services:
  gateway:
    build:
      # Context = gateway/ dir (holds go.mod); Dockerfile is at gateway/Dockerfile.
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8120:8080"
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_ROUTES_FILE: /etc/bench/routes.yaml
      GATEWAY_PLUGINS_FILE: /etc/bench/plugins.yaml
      GATEWAY_AUDIT_LOG: stdout
    volumes:
      - ./configs/bench-routes.yaml:/etc/bench/routes.yaml:ro
      # active-plugins.yaml written by harness.sh before each compose up
      - ./active-plugins.yaml:/etc/bench/plugins.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.50"
    networks:
      - bench-net
    depends_on:
      noop-upstream:
        condition: service_healthy
    restart: "no"

  noop-upstream:
    build:
      context: ..
      dockerfile: bench/Dockerfile.noop
    expose:
      - "8121"
    environment:
      PORT: "8121"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8121/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 32m
          cpus: "0.25"
    networks:
      - bench-net
    restart: "no"

  # mock-webhook: stub tenant-directory used by tenant-injector plugin bench (WI-4yaa.BENCH-2).
  # For other plugin benches this service starts idle — no traffic is routed to it.
  mock-webhook:
    build:
      context: ..
      dockerfile: bench/Dockerfile.mockwebhook
    expose:
      - "8122"
    environment:
      PORT: "8122"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8122/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 32m
          cpus: "0.25"
    networks:
      - bench-net
    restart: "no"

networks:
  bench-net:
    driver: bridge
